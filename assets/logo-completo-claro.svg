<svg viewBox="0 0 174 74" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@700&amp;display=swap');</style>
  </defs>
  <!--
    GRID MATH v2 (Quicksand Bold 48px):
    Z cap width ≈ 30px | leaf-O diameter = 32px (r=16) | ima width ≈ 78px
    Z: x=14 | leaf-O: cx=58 cy=35 | ima: x=76
    Word: x=14 to x=154 = 140px | Center: x=84
    Tagline centered at x=84 under wordmark
    Baseline: y=50 | x-height center: y=35
    Leaf stem tip at y=16 (3px above circle)
  -->
  <!-- Z (mayuscula) -->
  <text x="14" y="50" font-family="Quicksand, sans-serif" font-weight="700" font-size="48" fill="#3D3229">Z</text>
  <!-- Leaf-O (r=16 para igualar peso visual del x-height) -->
  <circle cx="58" cy="35" r="16" fill="none" stroke="#5B7553" stroke-width="2.6"/>
  <!-- Relleno hoja (mitad derecha, mas visible) -->
  <path d="M58 19 C67 19 74 26 74 35 C74 44 67 51 58 51" fill="#5B7553" opacity="0.3"/>
  <!-- Nervadura central (arranca desde el tope del circulo) -->
  <path d="M56 20 Q68 30 60 50" fill="none" stroke="#5B7553" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Tallo (punta de hoja sobre el circulo) -->
  <path d="M57 19 Q55 14 58 13" fill="none" stroke="#5B7553" stroke-width="1.6" stroke-linecap="round"/>
  <!-- ima -->
  <text x="76" y="50" font-family="Quicksand, sans-serif" font-weight="700" font-size="48" fill="#3D3229">ima</text>
  <!-- Tagline centrado en x=84 (centro exacto del wordmark) -->
  <text x="84" y="68" text-anchor="middle" font-family="Quicksand, sans-serif" font-weight="600" font-size="9" fill="#8A7B6B" letter-spacing="2.5">BIENESTAR ANIMAL</text>
</svg>